<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimpleCardGame - 房间</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="page-shell">
        <header id="game-topbar">
            <div>
                <div id="room-label">房间 #<span id="room-id">?</span></div>
                <div id="game-status-text">等待中...</div>
            </div>
            <button id="leave-btn" class="btn-small">退出房间</button>
        </header>

        <main class="game-grid">
            <section id="table-area" class="table-board">
                <div id="player-top" class="player-pos player-edge">
                    <div class="player-name">-</div>
                    <div class="player-played"></div>
                    <div class="player-info">
                        <span class="player-status"></span>
                        <span class="player-cards-left"></span>
                    </div>
                </div>

                <div id="table-mid">
                    <div id="player-left" class="player-pos player-edge">
                        <div class="player-name">-</div>
                        <div class="player-played"></div>
                        <div class="player-info">
                            <span class="player-status"></span>
                            <span class="player-cards-left"></span>
                        </div>
                    </div>

                    <div id="table-center" class="table-center">
                        <div id="turn-hint" class="turn-label">等待游戏开始...</div>
                        <div id="last-play-area" class="last-play-area"></div>
                    </div>

                    <div id="player-right" class="player-pos player-edge">
                        <div class="player-name">-</div>
                        <div class="player-played"></div>
                        <div class="player-info">
                            <span class="player-status"></span>
                            <span class="player-cards-left"></span>
                        </div>
                    </div>
                </div>

                <div id="player-bottom" class="player-pos player-edge player-bottom">
                    <div class="player-name">-</div>
                    <div class="player-played"></div>
                    <div class="player-info">
                        <span class="player-status"></span>
                        <span class="player-cards-left"></span>
                    </div>
                </div>
            </section>

            <aside class="sidebar">
                <div id="ready-area" class="panel ready-panel hidden">
                    <button id="ready-btn" class="btn-primary">准备</button>
                </div>
                <div id="chat-area" class="panel chat-panel">
                    <div class="panel-header">
                        <span>聊天</span>
                    </div>
                    <div id="chat-msgs" class="chat-list"></div>
                    <div id="chat-input-row" class="chat-input-row">
                        <input type="text" id="chat-input" maxlength="50" placeholder="输入消息并回车发送">
                        <button id="chat-send-btn" class="btn-secondary">发送</button>
                    </div>
                </div>
            </aside>
        </main>

        <div id="hand-area" class="hand-area">
            <div id="hand-cards" class="hand-cards"></div>
            <div id="hand-actions" class="hand-actions hidden">
                <button id="pass-btn" class="btn-secondary">不出</button>
                <button id="play-btn" class="btn-primary">出牌</button>
            </div>
        </div>
    </div>

    <script src="ws.js"></script>
    <script src="game.js"></script>
</body>
</html>
