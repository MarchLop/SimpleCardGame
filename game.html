<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimpleCardGame - 牌桌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="page-shell">
    <header id="game-topbar">
        <div class="brand-block">
            <div class="brand-mark">♠</div>
            <div>
                <div id="room-label">房间 <span class="room-chip">#<span id="room-id">?</span></span></div>
                <div id="game-status-text">等待玩家加入...</div>
            </div>
        </div>
        <div class="top-actions">
            <div class="connection-dot"><i></i><span>在线</span></div>
            <button id="leave-btn" class="btn-small">退出</button>
        </div>
    </header>

    <main class="game-grid">
        <section id="table-area" class="table-board">
            <div class="table-felt-glow"></div>
            <div class="table-logo"><span>♠</span><b>Simple Card Game</b></div>
            <div class="deck-counter"><span class="deck-icon">🂠</span><span>牌局进行中</span></div>

            <div id="player-top" class="player-pos player-top">
                <div class="avatar">?</div>
                <div class="player-main">
                    <div class="player-name">-</div>
                    <div class="player-info"><span class="player-status"></span><span class="player-cards-left"></span><span class="player-identity"></span></div>
                </div>
                <div class="player-played"></div>
            </div>

            <div id="table-mid">
                <div id="player-left" class="player-pos player-side player-left">
                    <div class="avatar">?</div>
                    <div class="player-main"><div class="player-name">-</div><div class="player-info"><span class="player-status"></span><span class="player-cards-left"></span><span class="player-identity"></span></div></div>
                    <div class="player-played"></div>
                </div>

                <div id="table-center" class="table-center">
                    <div class="turn-status">
                        <div id="turn-hint" class="turn-label">等待游戏开始</div>
                        <div id="turn-timer" class="turn-timer">--</div>
                    </div>
                    <div class="center-divider"></div>
                    <div class="center-play-title">当前出牌</div>
                    <div id="last-play-player" class="last-play-player">等待出牌</div>
                    <div id="last-play-area" class="last-play-area"></div>
                    <div class="center-empty-hint">暂无牌面</div>
                </div>

                <div id="player-right" class="player-pos player-side player-right">
                    <div class="avatar">?</div>
                    <div class="player-main"><div class="player-name">-</div><div class="player-info"><span class="player-status"></span><span class="player-cards-left"></span><span class="player-identity"></span></div></div>
                    <div class="player-played"></div>
                </div>
            </div>

            <div id="player-bottom" class="player-pos player-bottom">
                <div class="avatar">我</div>
                <div class="player-main">
                    <div class="player-name">-</div>
                    <div class="player-info"><span class="player-status"></span><span class="player-cards-left"></span><span class="player-identity"></span></div>
                </div>
                <div class="player-played"></div>
            </div>
        </section>

        <aside class="sidebar">
            <div id="ready-area" class="panel ready-panel hidden">
                <div class="panel-title">准备开始</div>
                <div class="panel-subtitle">4 位玩家全部准备后自动发牌</div>
                <button id="ready-btn" class="btn-primary">准备</button>
            </div>
            <div id="chat-area" class="panel chat-panel">
                <div class="panel-header"><span>牌桌聊天</span><span class="chat-live">● LIVE</span></div>
                <div id="chat-msgs" class="chat-list"></div>
                <div id="chat-input-row" class="chat-input-row">
                    <input type="text" id="chat-input" maxlength="50" placeholder="输入消息，Enter 发送">
                    <button id="chat-send-btn" class="btn-secondary">发送</button>
                </div>
            </div>
        </aside>
    </main>

    <div id="hand-area" class="hand-area">
        <div class="hand-header"><span>你的手牌</span><span id="hand-count"></span></div>
        <div id="hand-cards" class="hand-cards"></div>
        <div id="hand-actions" class="hand-actions hidden">
            <button id="pass-btn" class="btn-secondary">不出</button>
            <button id="play-btn" class="btn-primary">出牌</button>
        </div>
    </div>
</div>
<script src="ws.js"></script>
<script src="game.js"></script>
</body>
</html>
