<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimpleCardGame - 大厅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="page-shell">
        <header class="topbar">
            <div>
                <div class="title">SimpleCardGame</div>
                <div class="subtitle">快速加入房间，和好友一起开局</div>
            </div>
            <div class="status-pill">
                <span id="status-dot" class="dot-offline"></span>
                <span id="status-text">未连接</span>
            </div>
        </header>

        <section class="panel">
            <div class="panel-header">
                <span>昵称设置</span>
                <span class="hint">昵称会在游戏内显示</span>
            </div>
            <div class="input-group">
                <label for="nick-input">昵称</label>
                <input type="text" id="nick-input" maxlength="10" placeholder="输入昵称">
                <button id="save-nick-btn" class="btn-primary">保存</button>
            </div>
        </section>

        <section id="lobby-section" class="panel hidden">
            <div class="panel-header">
                <span>房间列表</span>
                <button id="create-room-btn" class="btn-primary">创建房间</button>
            </div>
            <div id="room-list" class="room-list">
                <div class="empty-msg">暂无房间，点击上方创建</div>
            </div>
        </section>
    </div>

    <script src="ws.js"></script>
    <script src="lobby.js"></script>
</body>
</html>
